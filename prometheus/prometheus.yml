# Prometheus scrape configuration for docker-compose.yml (the API is reachable as api:8000).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: opspilot-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
